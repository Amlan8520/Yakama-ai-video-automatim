name: YAKAMA Free Story Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  create-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Voice and Video Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          espeak-ng --version
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Animal Story Package
        run: python main.py

      - name: Save Story Files
        uses: actions/upload-artifact@v4
        with:
          name: YAKAMA-Free-Story-Package
          path: output/
          if-no-files-found: error
